# ==========================================================
# Cypress Tests - Demoblaze (modul Cart & Checkout)
# Pipeline 4 stage:  TEST -> REPORT -> UPDATE GSHEET -> NOTIFY
# ==========================================================
name: Cypress Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # GitHub Actions memakai UTC (WIB = UTC+7)
    - cron: "0 23 * * 0-5" # 06:00 WIB, Senin-Sabtu
    - cron: "0 5 * * 1-6" # 12:00 WIB, Senin-Sabtu

permissions:
  contents: read

jobs:
  # ========================================================
  # STAGE 1: TEST
  # Jalankan semua spec Cypress. Job ini merah kalau ada test gagal.
  # ========================================================
  cypress-test:
    name: "1. Run Cypress Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress tests
        run: |
          npx cypress run \
            --browser chrome \
            --reporter mochawesome \
            --reporter-options "reportDir=cypress/reports/mochawesome,overwrite=false,html=false,json=true"

      # Step di bawah ini jalan walau test gagal (if: always())
      - name: Merge mochawesome JSON
        if: always()
        run: |
          if ls cypress/reports/mochawesome/*.json >/dev/null 2>&1; then
            npx mochawesome-merge "cypress/reports/mochawesome/*.json" > merged.json
            echo "Merged $(ls cypress/reports/mochawesome/*.json | wc -l) file report"
          else
            echo "::warning::Tidak ada file report mochawesome yang dihasilkan"
          fi

      - name: Upload merged results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: merged.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

      - name: Upload screenshots (test gagal)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
          overwrite: true
          retention-days: 7

  # ========================================================
  # STAGE 2: REPORT
  # Generate HTML report (mochawesome) lalu deploy ke GitHub Pages.
  # ========================================================
  report:
    name: "2. Generate & Deploy Report"
    runs-on: ubuntu-latest
    needs: cypress-test
    if: always()
    permissions:
      contents: write # dibutuhkan untuk push ke branch gh-pages
    concurrency:
      group: deploy-gh-pages
      cancel-in-progress: false
    env:
      CYPRESS_INSTALL_BINARY: "0" # job ini tidak butuh binary Cypress

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download merged results
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: .
        continue-on-error: true

      - name: Generate HTML report
        run: |
          if [ ! -f merged.json ]; then
            echo "::error::merged.json tidak ditemukan, Cypress tidak menghasilkan hasil test"
            exit 1
          fi
          npx marge merged.json \
            -f index \
            -o report \
            -t "Cypress Report - Run #${{ github.run_number }}" \
            --inline

      - name: Upload HTML report (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-report
          path: report
          overwrite: true
          retention-days: 7

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./report
          destination_dir: run-${{ github.run_number }}
          keep_files: true

  # ========================================================
  # STAGE 3: UPDATE GOOGLE SHEET
  # Jalan SELALU (pass atau fail) supaya riwayat run lengkap.
  # ========================================================
  # update-gsheet:
