  #   env:
  #     CYPRESS_INSTALL_BINARY: "0"

  #   steps:
  #     - name: Checkout repo
  #       uses: actions/checkout@v4

  #     - name: Setup Node.js
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: 20
  #         cache: npm

  #     - name: Install dependencies
  #       run: npm ci

  #     - name: Download merged results
  #       uses: actions/download-artifact@v4
  #       with:
  #         name: test-results
  #         path: .
  #       continue-on-error: true

  #     - name: Update Google Sheet
  #       run: node scripts/sheets-updater.js
  #       env:
  #         GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
  #         GSHEET_ID: ${{ secrets.GSHEET_ID }}
  #         CYPRESS_RESULT: ${{ needs.cypress-test.result }}
  #         REPORT_RESULT: ${{ needs.report.result }}

  # ========================================================
  # STAGE 4: NOTIFY DISCORD
  # Satu job untuk pass & fail. Tetap jalan walau stage 2/3 gagal.
  # ========================================================
  notify:
    name: "4. Notify Discord"
    runs-on: ubuntu-latest
    needs: [cypress-test, report] # [cypress-test, report, update-gsheet] 
    if: always()

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download merged results
        uses: actions/download-artifact@v4
        with:
          name: test-results
          path: .
        continue-on-error: true

      - name: Send Discord notification
        run: node scripts/notify-discord.js
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          # GSHEET_URL: https://docs.google.com/spreadsheets/d/${{ secrets.GSHEET_ID }}/edit
          CYPRESS_RESULT: ${{ needs.cypress-test.result }}
          REPORT_RESULT: ${{ needs.report.result }}
          # SHEET_RESULT: ${{ needs.update-gsheet.result }}